{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      /* Comienza en un tono medio derivado de tu azul y termina en uno claro */
      background: linear-gradient(135deg, #01163f 0%, #214ba7 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-custom {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    /* Estilos para el formulario manual */
    .form-group {
      margin-bottom: 1.2rem;
    }
    
    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      color: #6c757d;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-control {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: #212529;
      background-color: #fff;
      background-clip: padding-box;
      border: 1px solid #ced4da;
      border-radius: 0.5rem;
      transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
    }

    .form-control:focus {
      color: #212529;
      background-color: #fff;
      border-color: #86b7fe;
      outline: 0;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    
    .btn-login {
      padding: 0.8rem;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Estilo para la imagen del logo añadida */
    .company-logo {
        height: 110px; /* Ajusta este tamaño según tu imagen */
        width: auto;
        object-fit: contain;
    }

    .bg-menu {
      background-color: #05174F;
    }

    .bg-menu-light {
      background-color: #07286D;
    }

    .btn-color {
      background-color: #05174F;
      color: #D5D3D5;
    }

    .btn-color:hover {
      background-color: #092C86;
      color: #D5D3D5;
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        
        <div class="card card-custom bg-menu p-4 p-md-5">
          
          <div class="text-center mb-4">
            <!-- Contenedor flexible para alinear ícono e imagen lado a lado -->
            <div class="d-flex justify-content-center align-items-center gap-3 mb-3">
                <!-- NUEVA IMAGEN DE EMPRESA -->
                <!-- Cambia el 'src' por la ruta real de tu logo -->
                <img src="{% static 'images/logo-blanco1.png' %}" alt="Logo de la empresa" class="company-logo">
            </div>

            <h3 class="fw-bold" style="color: #fffafa;">Bienvenido</h3>
            <p style="color: #fffafa;">Ingresa tus credenciales para continuar</p>
          </div>

          <form method="post" novalidate>
            {% csrf_token %}
            
            <!-- CAMPO DE USUARIO (Manual para español) -->
            <div class="form-group">
                <label for="id_username" class="form-label text-white">Usuario</label>
                <!-- Es importante mantener name="username" para que Django lo reconozca -->
                <input type="text" name="username" class="form-control" id="id_username" placeholder="Escribe tu usuario" required>
            </div>

            <!-- CAMPO DE CONTRASEÑA (Manual para español) -->
            <div class="form-group">
                <label for="id_password" class="form-label text-white">Contraseña</label>
                <!-- Es importante mantener name="password" para que Django lo reconozca -->
                <input type="password" name="password" class="form-control" id="id_password" placeholder="••••••••" required>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-color">
                Entrar
              </button>
            </div>
          </form>

          {% if form.errors %}
            <div class="alert alert-danger d-flex align-items-center mt-4 shadow-sm border-0" role="alert">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
              </svg>
              <div>
                Usuario o contraseña inválidos.
              </div>
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>

</body>
</html>
